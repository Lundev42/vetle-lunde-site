# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Building and deploying are separate jobs. deploy-pages looks up the
  # uploaded artifact through the Actions API, and when it ran in the same
  # job, a fraction of a second after the upload, it sometimes found
  # "0 artifacts" and failed. A separate job only starts once the upload
  # has been registered.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # Publish only the public website files. Tests, tooling, the unused
      # contact.php and the original full-size photos (which still contain
      # camera/GPS metadata) stay in the repository but are not deployed.
      - name: Assemble site
        run: |
          mkdir -p _site/images
          cp *.html robots.txt sitemap.xml _site/
          cp -r assets _site/
          cp -r images/optimized _site/images/
          cp images/og-image.jpg _site/images/
          touch _site/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
