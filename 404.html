<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0f1117">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-src 'none'; upgrade-insecure-requests">
  <!-- GitHub Pages serves this file for missing URLs at any depth, so all
       relative links resolve from the site root via <base>. -->
  <base href="/vetle-lunde-site/">
  <title>Fant ikke siden – Vetle Lunde</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🪨</text></svg>">
  <link rel="stylesheet" href="assets/css/site.css">
  <script src="assets/js/theme-init.js"></script>
  <style>
    main {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 48px 20px;
      text-align: center;
    }

    .code {
      font-family: 'Courgette', cursive;
      font-size: 4rem;
      color: var(--accent);
      line-height: 1;
    }

    h1 {
      font-size: 1.8rem;
      color: var(--text-heading);
    }

    p {
      color: var(--text-muted);
      line-height: 1.7;
      max-width: 46ch;
    }

    .home-link {
      margin-top: 12px;
      display: inline-block;
      padding: 10px 20px;
      border-radius: 10px;
      background: var(--accent-strong);
      color: #fff;
      text-decoration: none;
      font-weight: 500;
    }

    .home-link:hover {
      filter: brightness(1.1);
    }
  </style>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">404</p>
    <h1>Fant ikke siden</h1>
    <p>Siden du leter etter finnes ikke, eller den har blitt flyttet.</p>
    <p lang="en">The page you are looking for does not exist or has been moved.</p>
    <a class="home-link" href="index.html">Til forsiden / Go to the home page</a>
  </main>
</body>
</html>
